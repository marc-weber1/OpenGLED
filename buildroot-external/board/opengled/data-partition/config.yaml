LED_SETTINGS:
  DMA: 10
  GPIO_PIN: 10
  WIDTH: 144
  HEIGHT: 1
  BRIGHTNESS: 32
  GAMMA_CORRECTION: 2.0

AUDIO_SETTINGS:
  ALSA_INPUT_DEVICE: plughw:0
  CHANNELS: 1
  FREQUENCY_BANDS: 4
  BAND_CUTOFF_FREQUENCIES: [ 20, 250, 1000, 4000, 20000 ]
  SAMPLE_RATE: 44100
  SAMPLES_PER_PIXEL: 1024
  PIXELS_PER_BAND: 144

# Cycle through shaders with a KY-040 rotary encoder (BCM pin numbers)
ROTARY_ENCODER:
  PIN_CLK: 17
  PIN_DT: 27
  GPIOCHIP: /dev/gpiochip0

SHADER_FOLDER: /data/shaders
