# DHCP for the USB gadget link: hands the connected phone/laptop an address
# next to the Pi's static 10.55.0.1 (set in /etc/init.d/S30usbgadget).
interface	usb0
start		10.55.0.10
end		10.55.0.19
max_leases	10
option	subnet	255.255.255.0
lease		86400
lease_file	/var/run/udhcpd.leases
# Deliberately no router/dns options: the host keeps its normal internet
# route and only talks to 10.55.0.0/24 over the USB link.
